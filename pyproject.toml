[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-system"
version = "0.1.0"
description = "UI-first YOLOv8 fine-tuning and edge inference research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40,<2",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "gpu: opt-in tests that download weights or require a working GPU runtime",
]
